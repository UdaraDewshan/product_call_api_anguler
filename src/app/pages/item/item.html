<div class="container mt-5">
  <div class="row">
    
    @for (product of productList; track product.id) {
      <div class="col-md-4 col-sm-6 mb-4">
        <div class="card h-100 shadow-sm border-0 rounded-3">
          
          <img [src]="product.thumbnail" class="card-img-top rounded-top-3" alt="{{ product.title }}" style="height: 200px; object-fit: cover;">
          
          <div class="card-body">
            <h5 class="card-title fw-bold">{{ product.title }}</h5>
            
            <p class="card-text text-muted small">{{ product.description}}...</p>
            
            <h5 class="text-primary fw-bold mb-3">${{ product.price }}</h5>
          </div>
          
          <div class="card-footer bg-white border-top-0 pb-3">
            <button class="btn btn-primary w-100 fw-semibold">
              Add to Cart
            </button>
          </div>
          
        </div>
      </div>
    } 

  </div>
</div>
